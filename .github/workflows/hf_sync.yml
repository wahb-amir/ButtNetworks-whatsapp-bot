name: Sync to Hugging Face
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Inject HF Config and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Create a temporary README with the metadata
          # Note: The YAML block must start at the very first line of the file
          cat <<EOT > temp_readme.md
          ---
          title: WhatsApp RAG Bot
          emoji: 🤖
          colorFrom: blue
          colorTo: green
          sdk: docker
          pinned: false
          ---

          EOT
          
          # 2. Append your original GitHub README content
          cat README.md >> temp_readme.md
          mv temp_readme.md README.md

          # 3. Setup Git identity
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # 4. Push to Hugging Face
          git remote add hf https://$username:$HF_TOKEN@huggingface.co/spaces/$username/$reponame.git
          
          git add README.md
          git commit -m "Internal: Inject HF metadata for build"
          git push -f hf main