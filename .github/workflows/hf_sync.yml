name: Sync to Hugging Face

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Inject HF Config and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: wahbamir
          HF_REPO: whatsapp-rag-bot
        run: |
          set -e  # stop on errors

          # 1. Build README safely
          cat <<EOF > temp_readme.md
          ---
          title: WhatsApp RAG Bot
          emoji: 🤖
          ---

          EOF

          cat README.md >> temp_readme.md
          mv temp_readme.md README.md

          # 2. Git config
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 3. Setup Hugging Face remote safely
          HF_URL="https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_REPO"

          if git remote | grep hf; then
            git remote set-url hf "$HF_URL"
          else
            git remote add hf "$HF_URL"
          fi

          # 4. Commit safely (avoid empty commit failure)
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Sync to Hugging Face"

          # 5. Push
          git push -f hf main